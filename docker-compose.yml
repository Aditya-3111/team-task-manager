version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: teamtask_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: teamtaskdb
      MYSQL_USER: teamtask
      MYSQL_PASSWORD: teamtask123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build: ./backend
    container_name: teamtask_backend
    environment:
      DATABASE_URL: mysql+pymysql://teamtask:teamtask123@mysql:3306/teamtaskdb
      JWT_SECRET_KEY: change-this-secret-key-in-production
      FLASK_ENV: development
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: teamtask_frontend
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
